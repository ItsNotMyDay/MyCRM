{% extends "crm/base.html" %}

{% block title %}Редактирование заметки — {{ client.full_name }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="mb-0">Редактирование заметки</h1>
  <a href="{% url 'crm:client_detail' client.id %}" class="btn btn-outline-secondary btn-sm">
    ← Назад в карточку клиента
  </a>
</div>

<div class="card">
  <div class="card-header">
    Клиент: {{ client.full_name }}
  </div>
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Текст заметки</label>
        <textarea name="text" class="form-control" rows="5">{{ note.text }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Сохранить</button>
      <a href="{% url 'crm:client_detail' client.id %}" class="btn btn-secondary ms-2">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
